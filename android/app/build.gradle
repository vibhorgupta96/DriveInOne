plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.driveinone.drive_in_one"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.driveinone.drive_in_one"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders += [
            'appAuthRedirectScheme': 'com.driveinone.app'
        ]
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
