name: drive_in_one
description: Unified cloud photo & video gallery with AI face recognition
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.1.0

  # Auth
  google_sign_in: ^7.2.0
  flutter_appauth: ^11.0.0
  flutter_secure_storage: ^10.0.0

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Network
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5
  video_thumbnail: ^0.5.3

  # AI / ML
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.12.1
  image: ^4.3.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.0
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  share_plus: ^12.0.1
  photo_view: ^0.15.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_foreground_task: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.9.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/DriveInOne_Icon.jpg"
  adaptive_icon_background: "#1a2332"
  adaptive_icon_foreground: "assets/images/DriveInOne_Icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
